<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Sequência de inicialização do sistema MATHEUS.OS" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#FF2E97"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#FF2E97"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00F0FF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="10" y="10" width="880" height="260" rx="14"/></clipPath>
  </defs>

  <!-- Fundo -->
  <rect x="10" y="10" width="880" height="260" rx="14" fill="#0D1117"/>
  <rect x="10" y="10" width="880" height="260" rx="14" fill="url(#grid)"/>

  <g clip-path="url(#screen)">
    <!-- Linha de varredura -->
    <rect x="10" y="0" width="880" height="3" fill="#00F0FF" opacity="0.18">
      <animate attributeName="y" values="10;270;10" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Barra de título -->
    <rect x="10" y="10" width="880" height="34" fill="#00F0FF" fill-opacity="0.07"/>
    <circle cx="34" cy="27" r="6" fill="#FF2E97"/>
    <circle cx="56" cy="27" r="6" fill="#F5C518"/>
    <circle cx="78" cy="27" r="6" fill="#00F0FF"/>
    <text x="450" y="32" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#00F0FF" opacity="0.8" letter-spacing="3">MATHEUS.OS // BOOT SEQUENCE</text>

    <g font-family="'Courier New', monospace" font-size="15" filter="url(#glow)">
      <text x="36" y="78" fill="#7EE787">
        [ OK ] Carregando núcleo Java ...............
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.04;0.05;0.95;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="36" y="104" fill="#7EE787">
        [ OK ] Montando módulos Back-End + IA .......
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.13;0.95;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="36" y="130" fill="#7EE787">
        [ OK ] Sincronizando repositórios GitHub ....
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.20;0.21;0.95;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="36" y="156" fill="#00F0FF">
        [ .. ] Compilando perfil de desenvolvedor ...
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.29;0.95;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Barra de progresso -->
    <rect x="36" y="178" width="500" height="12" rx="6" fill="#00F0FF" fill-opacity="0.12" stroke="#00F0FF" stroke-opacity="0.5"/>
    <rect x="36" y="178" width="0" height="12" rx="6" fill="url(#bar)" filter="url(#glow)">
      <animate attributeName="width" values="0;0;500;500;0" keyTimes="0;0.04;0.55;0.95;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="552" y="189" font-family="'Courier New', monospace" font-size="13" fill="#00F0FF">
      CARREGANDO
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </text>

    <!-- Resultado final -->
    <g font-family="'Courier New', monospace" filter="url(#glow)">
      <text x="36" y="236" font-size="26" font-weight="bold" fill="#00F0FF" letter-spacing="4">
        &gt; ACESSO CONCEDIDO
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.59;0.95;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <rect x="352" y="216" width="14" height="26" fill="#FF2E97">
        <animate attributeName="opacity" values="0;0;1;0;1;0;1;1;0" keyTimes="0;0.58;0.60;0.66;0.72;0.78;0.84;0.95;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Reator / HUD -->
    <g transform="translate(760 150)" fill="none" stroke-linecap="round">
      <circle r="62" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1"/>
      <circle r="50" stroke="#00F0FF" stroke-width="3" stroke-dasharray="30 18" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle r="38" stroke="#FF2E97" stroke-width="2" stroke-dasharray="8 10" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle r="24" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.7"/>
      <circle r="10" fill="#00F0FF" stroke="none" filter="url(#glow)">
        <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Moldura -->
  <rect x="10" y="10" width="880" height="260" rx="14" fill="none" stroke="url(#border)" stroke-width="2"/>
</svg>
